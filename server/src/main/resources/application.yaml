spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: fuel-station-management
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE}
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT}
      max-lifetime: ${DB_POOL_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
