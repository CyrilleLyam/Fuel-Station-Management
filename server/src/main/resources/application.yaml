spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: fuel-station-management
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE}
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT}
      max-lifetime: ${DB_POOL_MAX_LIFETIME}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    property-naming-strategy: SNAKE_CASE
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    signing-private-key-path: ${JWT_SIGNING_PRIVATE_KEY_PATH:file:./keys/signing-private.pem}
    signing-public-key-path: ${JWT_SIGNING_PUBLIC_KEY_PATH:file:./keys/signing-public.pem}
    encryption-private-key-path: ${JWT_ENCRYPTION_PRIVATE_KEY_PATH:file:./keys/encryption-private.pem}
    encryption-public-key-path: ${JWT_ENCRYPTION_PUBLIC_KEY_PATH:file:./keys/encryption-public.pem}
    access-token-ttl: ${JWT_ACCESS_TTL:P1D}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@fuel-station.local}
    password: ${ADMIN_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
