databaseChangeLog:
  - changeSet:
      id: 010-create-sales-table
      author: dev
      changes:
        - sql:
            sql: >
              create table sales (
                id bigint generated by default as identity,
                reference uuid not null unique,
                station_id bigint not null references stations (id),
                tank_id bigint not null references tanks (id),
                product_id bigint not null references products (id),
                attendant varchar(100) not null,
                quantity numeric(14, 3) not null,
                unit_price numeric(12, 3) not null,
                total_amount numeric(14, 2) not null,
                payment_method varchar(20) not null,
                sold_at timestamp(6) with time zone not null,
                created_at timestamp(6) with time zone not null,
                updated_at timestamp(6) with time zone not null,
                primary key (id),
                constraint sales_quantity_positive check (quantity > 0),
                constraint sales_unit_price_non_negative check (unit_price >= 0),
                constraint sales_total_amount_non_negative check (total_amount >= 0)
              );
        - sql:
            sql: create index idx_sales_station_sold_at on sales (station_id, sold_at desc);
        - sql:
            sql: create index idx_sales_product_id on sales (product_id);
