databaseChangeLog:
  - changeSet:
      id: 005-create-products-table
      author: dev
      changes:
        - sql:
            sql: >
              create table products (
                id bigint generated by default as identity,
                name varchar(255) not null,
                sku varchar(50) not null unique,
                fuel_type varchar(20) not null,
                unit varchar(20) not null,
                unit_price numeric(12, 3) not null default 0,
                active boolean not null default true,
                created_at timestamp(6) with time zone not null,
                updated_at timestamp(6) with time zone not null,
                primary key (id)
              );
  - changeSet:
      id: 005-seed-standard-products
      author: dev
      validCheckSum: ANY
      changes:
        - sql:
            sql: >
              insert into products (name, sku, fuel_type, unit, unit_price, active, created_at, updated_at) values
                ('Diesel', 'FUEL-DIESEL', 'DIESEL', 'L', 1.150, true, now(), now()),
                ('Regular', 'FUEL-REGULAR', 'REGULAR', 'L', 1.250, true, now(), now()),
                ('Premium', 'FUEL-PREMIUM', 'PREMIUM', 'L', 1.400, true, now(), now()),
                ('Lubricant', 'FUEL-LUBRICANT', 'LUBRICANT', 'L', 4.500, true, now(), now())
              on conflict (sku) do nothing;
