databaseChangeLog:
  - changeSet:
      id: 012-create-sales-facts-table
      author: dev
      changes:
        - sql:
            sql: >
              create table sales_facts (
                id bigint generated by default as identity,
                sale_reference uuid not null unique,
                station_id bigint not null,
                product_id bigint not null,
                tank_id bigint not null,
                attendant varchar(100) not null,
                business_date date not null,
                quantity numeric(14, 3) not null,
                total_amount numeric(14, 2) not null,
                payment_method varchar(20) not null,
                occurred_at timestamp(6) with time zone not null,
                created_at timestamp(6) with time zone not null,
                updated_at timestamp(6) with time zone not null,
                primary key (id)
              );
        - sql:
            sql: create index idx_sales_facts_station_business_date on sales_facts (station_id, business_date);
        - sql:
            sql: create index idx_sales_facts_product_business_date on sales_facts (product_id, business_date);
        - sql:
            sql: create index idx_sales_facts_attendant_business_date on sales_facts (attendant, business_date);
