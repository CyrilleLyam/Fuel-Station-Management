databaseChangeLog:
  - changeSet:
      id: 006-create-tanks-table
      author: dev
      changes:
        - sql:
            sql: >
              create table tanks (
                id bigint generated by default as identity,
                station_id bigint not null references stations (id),
                product_id bigint references products (id),
                label varchar(255) not null,
                capacity numeric(14, 3) not null,
                current_quantity numeric(14, 3) not null default 0,
                active boolean not null default true,
                created_at timestamp(6) with time zone not null,
                updated_at timestamp(6) with time zone not null,
                primary key (id),
                constraint tanks_current_quantity_non_negative check (current_quantity >= 0),
                constraint tanks_current_quantity_within_capacity check (current_quantity <= capacity)
              );
        - sql:
            sql: create index idx_tanks_station_id on tanks (station_id);
