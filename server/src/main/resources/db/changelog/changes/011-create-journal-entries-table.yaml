databaseChangeLog:
  - changeSet:
      id: 011-create-journal-entries-table
      author: dev
      changes:
        - sql:
            sql: >
              create table journal_entries (
                id bigint generated by default as identity,
                reference varchar(100) not null unique,
                station_id bigint not null references stations (id),
                entry_date date not null,
                memo varchar(255) not null,
                created_at timestamp(6) with time zone not null,
                updated_at timestamp(6) with time zone not null,
                primary key (id)
              );
        - sql:
            sql: >
              create table journal_entry_lines (
                journal_entry_id bigint not null references journal_entries (id) on delete cascade,
                line_number integer not null,
                account varchar(40) not null,
                debit numeric(14, 2) not null default 0,
                credit numeric(14, 2) not null default 0,
                primary key (journal_entry_id, line_number),
                constraint journal_entry_lines_amounts_non_negative check (debit >= 0 and credit >= 0)
              );
        - sql:
            sql: create index idx_journal_entries_station_entry_date on journal_entries (station_id, entry_date);
        - sql:
            sql: create index idx_journal_entry_lines_account on journal_entry_lines (account);
